<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#283618"/>
      <stop offset="0.5" stop-color="#3a5a40"/>
      <stop offset="1" stop-color="#588157"/>
    </linearGradient>
    <linearGradient id="goldFlame" x1="256" y1="120" x2="256" y2="280" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffbe0b"/>
      <stop offset="0.5" stop-color="#fb5607"/>
      <stop offset="1" stop-color="#ff006e"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Outer Zen Aura Ring -->
  <circle cx="256" cy="256" r="195" stroke="#dad7cd" stroke-width="8" stroke-dasharray="14 10" opacity="0.35"/>
  <circle cx="256" cy="256" r="175" stroke="#a3b18a" stroke-width="4" opacity="0.6"/>

  <!-- Open Book Wings -->
  <path d="M256 370 C210 330 145 328 100 334 C94 335 90 330 90 324 L90 200 C90 194 95 190 101 189 C148 184 212 188 256 226 C300 188 364 184 411 189 C417 190 422 194 422 200 L422 324 C422 330 418 335 412 334 C367 328 302 330 256 370 Z" 
        fill="#fdfbf7" 
        opacity="0.95"/>

  <!-- Book Spine Divider -->
  <path d="M256 226 L256 370" stroke="#a3b18a" stroke-width="4" stroke-linecap="round"/>

  <!-- Radiant Golden Focus Flame floating above the book -->
  <path d="M256 100 C275 145 305 180 305 215 C305 255 280 275 256 275 C232 275 207 255 207 215 C207 180 237 145 256 100 Z" 
        fill="url(#goldFlame)" 
        filter="url(#glow)"/>
  
  <!-- Inner Flame Core -->
  <path d="M256 150 C267 180 282 200 282 225 C282 248 270 260 256 260 C242 260 230 248 230 225 C230 200 245 180 256 150 Z" 
        fill="#ffffff" 
        opacity="0.85"/>
</svg>
